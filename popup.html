<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Profile Scraper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup">
      <h1>LinkedIn Profile</h1>
      <p class="status" id="status">Ready to extract</p>

      <button id="extractBtn" class="primary-btn">Extract data</button>
      <button id="copyBtn" class="secondary-btn">Copy JSON</button>

      <pre id="resultBox">{
  "firstName": "",
  "lastName": "",
  "jobTitle": "",
  "skills": [],
  "yearsOfExperience": 0
}</pre>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
